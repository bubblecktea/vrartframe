<!DOCTYPE html>
<html>
  <head>
    <title>Khung Tranh AR 3D</title>
    <!-- Nhúng đúng phiên bản thư viện A-Frame và AR.js -->
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  </head>
  <body style="margin: 0px; overflow: hidden;">
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
      <!-- Khai báo file 3D của bạn (scene.gltf) -->
      <a-assets>
        <a-asset-item id="myModel" src="scene.gltf"></a-asset-item>
      </a-assets>

      <!-- Khi quét trúng hình Hiro Marker, mô hình scene.gltf sẽ hiện ra -->
      <a-marker preset="hiro">
        <a-entity 
          gltf-model="#myModel" 
          scale="0.5 0.5 0.5" 
          position="0 0 0"
          rotation="-90 0 0">
        </a-entity>
      </a-marker>

      <a-entity camera></a-entity>
    </a-scene>
  </body>
</html>
